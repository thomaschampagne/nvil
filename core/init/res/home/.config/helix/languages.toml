# --- Spellcheck ---
[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
config = { "harper-ls.diagnosticSeverity" = "warning" }

# --- Pre Defined LSP ---
# html/css
[language-server.emmet-language-server]
command = "emmet-ls"
args = ["--stdio"]

# XML
[language-server.xml-language-server]
command = "lemminx"

# --- BASH ---
[[language]]
name = "bash"
language-servers = ["bash-language-server"]
indent = { tab-width = 2, unit = "  " }
# shfmt: 2-space indent (Google Shell Style Guide), binary ops start next line (-bn), indent switch cases (-ci), space after redirects (-sr)
formatter = { command = "shfmt", args = ["-i", "2", "-bn", "-ci", "-sr"] }
auto-format = true

# --- MD ---
[[language]]
name = "markdown"
language-servers = ["harper-ls"]
formatter = { command = "dprint", args = ["fmt", "--stdin", "markdown"] }
auto-format = true

# --- TOML ---
[[language]]
name = "toml"
formatter = { command = "dprint", args = ["fmt", "--stdin", "toml"] }
auto-format = true

# --- JSON ---
[[language]]
name = "json"
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }
auto-format = true

# --- YAML ---
[[language]]
name = "yaml"
formatter = { command = "dprint", args = ["fmt", "--stdin", "yaml"] }
auto-format = true

# Schemas Refs
[language-server.yaml-language-server.config.yaml.schemas]
# - K8s
kubernetes = [
  "*pod*.{yml,yaml}",
  "*deployment*.{yml,yaml}",
  "*statefulset*.{yml,yaml}",
  "*daemonset*.{yml,yaml}",
  "*replicaset*.{yml,yaml}",
  "*job*.{yml,yaml}",
  "*cronjob*.{yml,yaml}",
  "*configmap*.{yml,yaml}",
  "*secret*.{yml,yaml}",
  "*pv*.{yml,yaml}",
  "*pvc*.{yml,yaml}",
  "*storageclass*.{yml,yaml}",
  "*service*.{yml,yaml}",
  "*ingress*.{yml,yaml}",
  "*networkpolicy*.{yml,yaml}",
  "*endpoint*.{yml,yaml}",
  "*hpa*.{yml,yaml}",
  "*poddisruptionbudget*.{yml,yaml}",
  "*role*.{yml,yaml}",
  "*rolebinding*.{yml,yaml}",
  "*clusterrole*.{yml,yaml}",
  "*clusterrolebinding*.{yml,yaml}",
  "*serviceaccount*.{yml,yaml}",
  "*namespace*.{yml,yaml}",
  "*node*.{yml,yaml}",
  "*crd*.{yml,yaml}",
  "*priorityclass*.{yml,yaml}",
  "*runtimeclass*.{yml,yaml}",
  "*ingressclass*.{yml,yaml}",
]
"http://json.schemastore.org/kustomization" = "kustomization.{yml,yaml}"
# - Compose
"https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json" = "*compose*.{yml,yaml}"
# - Github CI
"http://json.schemastore.org/github-workflow" = ".github/workflows/*.{yml,yaml}"
"http://json.schemastore.org/github-action" = ".github/action.{yml,yaml}"
# - GitLab CI
"https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json" = [".gitlab-ci.{yml,yaml}", ".gitlab/ci/*.{yml,yaml}"]
# - Azure Pipelines
"https://raw.githubusercontent.com/microsoft/azure-pipelines-vscode/master/service-schema.json" = ["azure-pipelines.{yml,yaml}"]

[language-server.yaml-language-server.config.yaml.format]
enable = true

# --- XML/HTML ---
[[language]]
name = "xml"
formatter = { command = "dprint", args = ["fmt", "--stdin", "xml"] }
language-servers = ["xml-language-server", "emmet-language-server"]
auto-format = true

[[language]]
name = "html"
file-types = ["html", "htm"]
formatter = { command = "dprint", args = ["fmt", "--stdin", "html"] }
language-servers = ["vscode-html-language-server", "emmet-language-server"]
auto-format = true

# --- CSS/SCSS ---
[[language]]
name = "css"
formatter = { command = "dprint", args = ["fmt", "--stdin", "css"] }
language-servers = ["vscode-css-language-server", "emmet-language-server"]
auto-format = true

[[language]]
name = "scss"
formatter = { command = "dprint", args = ["fmt", "--stdin", "scss"] }
language-servers = ["vscode-css-language-server", "emmet-language-server"]
auto-format = true
