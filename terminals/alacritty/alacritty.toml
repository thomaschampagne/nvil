[terminal]
shell = { program = "nu" }
# shell = { program = "pwsh.exe", args = ["-NoLogo"] }
osc52 = "CopyPaste"

[selection]
# Register mouse selection to system clipboard
save_to_clipboard = true

[mouse]
# Right click to paste
bindings = [
  { mouse = "Right", action = "Paste" },
]

[window]
padding = { x = 2, y = 2 }
dimensions = { columns = 160, lines = 48 }

# Font Config
[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[keyboard]
bindings = [
  { key = "q", mods = "Control|Shift", action = "Quit" },
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Enter", mods = "Alt", action = "ReceiveChar" },
]

# Colors (Dracula+) (https://github.com/alacritty/alacritty-theme/blob/master/themes/dracula_plus.toml)
[colors.primary]
background = '#212121'
foreground = '#F8F8F2'

[colors.cursor]
text = '#0E1415'
cursor = '#ECEFF4'

[colors.normal]
black = '#21222C'
red = '#FF5555'
green = '#50FA7B'
yellow = '#FFCB6B'
blue = '#82AAFF'
magenta = '#C792EA'
cyan = '#8BE9FD'
white = '#F8F9F2'

[colors.bright]
black = '#545454'
red = '#FF6E6E'
green = '#69FF94'
yellow = '#FFCB6B'
blue = '#D6ACFF'
magenta = '#FF92DF'
cyan = '#A4FFFF'
white = '#F8F8F2'
